name: update-matched-control-and-harness-timing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    strategy:
      fail-fast: false
      matrix:
        workload: [digits, wine, fashion]
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.18'
          cache: pip
          cache-dependency-path: requirements/study-cpu.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/study-cpu.txt
          python -m pip install --no-deps -e .
      - name: Run preregistered pairs on one logical CPU
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" python docs/scripts/run_update_control.py --workload "$WORKLOAD" \
            --data "$RUNNER_TEMP/datasets" --out "build/update-control/$WORKLOAD"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: update-control-${{ matrix.workload }}
          path: build/update-control/${{ matrix.workload }}/
          if-no-files-found: error
