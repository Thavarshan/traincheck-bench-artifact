name: implementation-checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.18'
          cache: pip
          cache-dependency-path: requirements/ci-cpu.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/ci-cpu.txt
          python -m pip install --no-deps -e .
      - name: Test implementation
        run: python -m pytest -q
      - name: Verify archived analyses without training
        run: |
          python docs/scripts/analyze_score_separation.py --output build/score-separation
          python docs/scripts/analyze_cutoff_resplits.py --output build/score-separation/resplits
