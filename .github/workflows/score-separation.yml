name: retrospective-score-separation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reanalyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.18'
      - name: Analyze frozen archives (no training)
        run: python docs/scripts/analyze_score_separation.py --output build/score-separation
      - name: Refit matched Digits cutoffs on pooled seed blocks
        run: python docs/scripts/analyze_cutoff_resplits.py --output build/score-separation/resplits
      - name: Render publication figures
        run: |
          python -m pip install matplotlib==3.10.8
          python docs/scripts/plot_score_separation.py --input build/score-separation
      - uses: actions/upload-artifact@v6
        with:
          name: score-separation-and-figures
          path: build/score-separation/
          if-no-files-found: error
