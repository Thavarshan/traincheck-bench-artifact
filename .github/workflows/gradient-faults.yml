name: count-preserving-gradient-faults
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairs:
    strategy:
      fail-fast: false
      matrix:
        workload: [digits, wine, fashion]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WORKLOAD: ${{ matrix.workload }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.18'
          cache: pip
          cache-dependency-path: requirements/study-cpu.txt
      - name: Install CPU dependencies and select a logical CPU
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/study-cpu.txt
          python -m pip install --no-deps -e .
          python -c 'import os; print(f"STUDY_CPU={min(os.sched_getaffinity(0))}")' >> "$GITHUB_ENV"
      - name: Fit cutoffs on development seeds
        run: |
          taskset -c "$STUDY_CPU" python docs/scripts/run_gradient_faults.py --phase development \
            --workload "$WORKLOAD" --data "$RUNNER_TEMP/datasets" --out "build/gradient-faults/$WORKLOAD"
      - uses: actions/upload-artifact@v6
        with:
          name: gradient-freeze-${{ matrix.workload }}
          path: build/gradient-faults/${{ matrix.workload }}/freeze.json
          if-no-files-found: error
      - name: Evaluate frozen cutoffs on fresh paired seeds
        run: |
          taskset -c "$STUDY_CPU" python docs/scripts/run_gradient_faults.py --phase evaluation \
            --workload "$WORKLOAD" --data "$RUNNER_TEMP/datasets" --out "build/gradient-faults/$WORKLOAD"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gradient-results-${{ matrix.workload }}
          path: build/gradient-faults/${{ matrix.workload }}/
          if-no-files-found: error
