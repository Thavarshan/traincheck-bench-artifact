name: matched-calibration-and-scaler-study
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DESIGN: docs/research/MATCHED_STUDY.json
      OUTPUT: build/matched-calibration
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.18'
          cache: pip
          cache-dependency-path: requirements/study-cpu.txt
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/study-cpu.txt
          python -m pip install --no-deps -e .
      - name: Select one logical CPU for both phases
        run: python -c 'import os; print(f"STUDY_CPU={min(os.sched_getaffinity(0))}")' >> "$GITHUB_ENV"
      - name: Collect development and freeze cutoffs
        run: |
          taskset -c "$STUDY_CPU" python docs/scripts/run_schedule_study.py --design "$DESIGN" \
            --phase development --workload digits --data "$RUNNER_TEMP/uci" --output "$OUTPUT/development/schedule-digits"
          python docs/scripts/analyze_schedule_study.py --phase development --design "$DESIGN" \
            --input "$OUTPUT/development" --output "$OUTPUT/development-analysis"
          python docs/scripts/matched_calibration.py freeze --root "$OUTPUT" --design "$DESIGN"
      - uses: actions/upload-artifact@v6
        with:
          name: pre-evaluation-matched-freeze
          path: |
            build/matched-calibration/frozen.json
            build/matched-calibration/development-analysis/summary.json
          if-no-files-found: error
      - name: Run untouched evaluation seeds and validate paired results
        run: |
          taskset -c "$STUDY_CPU" python docs/scripts/run_schedule_study.py --design "$OUTPUT/frozen.json" \
            --phase evaluation --workload digits --data "$RUNNER_TEMP/uci" --output "$OUTPUT/evaluation/schedule-digits"
          python docs/scripts/analyze_schedule_study.py --phase evaluation --design "$OUTPUT/frozen.json" \
            --input "$OUTPUT/evaluation" --output "$OUTPUT/evaluation-analysis"
          python docs/scripts/matched_calibration.py compare --root "$OUTPUT"
      - name: Probe GradScaler and StepLR
        run: taskset -c "$STUDY_CPU" python docs/scripts/run_scaler_probe.py --design "$OUTPUT/frozen.json" --root "$OUTPUT"
      - name: Recompute archived schedule outcomes under corrected miss semantics
        run: |
          env -u GITHUB_SHA python docs/scripts/analyze_schedule_study.py --phase evaluation --design docs/research/SCHEDULE_STUDY.json \
            --input results/schedule-study/evaluation/45045778246 --output "$OUTPUT/prior-analysis-corrected"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: matched-calibration-evidence
          path: build/matched-calibration/
          if-no-files-found: error
