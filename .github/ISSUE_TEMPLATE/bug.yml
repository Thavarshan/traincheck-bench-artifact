name: Implementation bug
description: Report a reproducible problem in the benchmark or its tests.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Release or commit
      placeholder: v0.1.0
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, environment, and relevant output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
