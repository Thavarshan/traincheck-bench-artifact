[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traincheck-bench"
version = "0.1.0"
description = "A CPU-first empirical benchmark for reliable neural-network training checks in CI"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
traincheck = "traincheck.cli:main"

[tool.setuptools.packages.find]
include = ["traincheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
